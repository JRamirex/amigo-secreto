<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<header><div data-orn></div><p class="eyebrow">Panel del organizador</p><h1><em>Seguimiento</em></h1><p id=res></p></header><div class="card"><div class="stat"><div class="ring" id="ring"><b id="pct">–</b></div><div><h2 style="margin:0">Progreso</h2><p class="hint" style="margin:2px 0 0" id="res2">Cargando…</p></div></div><div class="rows" id="t"></div><a class="btn full" id="csv" style="text-align:center;text-decoration:none">Descargar CSV</a></div></div>
<script src="deco.js"></script><script src="store.js"></script>
<script>const P=["Hilda", "Elio", "Jenny", "Claudia", "Leonor", "Nancy", "William", "Juanda", "Diana", "Santi", "Moni", "Willi", "Naty", "Juan Pa", "Leonardo", "Pilar", "Liliana", "Juancho", "Juanse", "María", "July", "Andrew"],$=i=>document.getElementById(i);
kvAll(P).then(all=>{if(!Array.isArray(all))throw 0;const r=P.map(n=>{const m=all.filter(w=>w.persona===n),k=m.filter(w=>w.deseo.trim()).length?Math.max(1,m.map(w=>w.deseo).join('\n').split('\n').filter(t=>t.trim()).length):0;return{nombre:n,deseos:k}});
const y=r.filter(x=>x.deseos).length;$('res').textContent='Quién ya pidió su regalo';$('res2').textContent=y+' de '+r.length+' ya subieron deseos';const pc=Math.round(100*y/r.length);$('pct').textContent=pc+'%';$('ring').style.background='conic-gradient(var(--salvia-o) '+pc+'%,var(--linea) 0)';
$('t').innerHTML=r.map(x=>'<div class="row"><span class="av" style="background:'+avatarColor(x.nombre)+'">'+initials(x.nombre)+'</span><span class="nm">'+x.nombre+'</span><span class="ct">'+x.deseos+' 🎁</span><span class="pill '+(x.deseos?'ok">Listo':'no">Pendiente')+'</span></div>').join('');
const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';$('csv').href=URL.createObjectURL(new Blob(['\ufeffpersona,deseo,url,timestamp\n'+all.map(w=>[w.persona,w.deseo,w.url,w.timestamp].map(q).join(',')).join('\n')],{type:'text/csv'}));$('csv').download='deseos.csv'})
.catch(()=>{$('res2').textContent='No se pudo leer la lista, intenta de nuevo en un momento'})</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<header><div data-orn></div><p class="eyebrow">Panel del organizador</p><h1><em>Seguimiento</em></h1><p id=res></p></header><div class="card"><div class="stat"><div class="ring" id="ring"><b id="pct">–</b></div><div><h2 style="margin:0">Progreso</h2><p class="hint" style="margin:2px 0 0" id="res2">Cargando…</p></div></div><div class="rows" id="t"></div><a class="btn full" id="csv" style="text-align:center;text-decoration:none">Descargar CSV</a></div></div>
<script src="deco.js"></script>
<script>const tk=new URLSearchParams(location.search).get('token')||'';document.getElementById('csv').href='/api/admin/seguimiento.csv?token='+encodeURIComponent(tk);
fetch('/api/admin/seguimiento?token='+encodeURIComponent(tk)).then(r=>r.json()).then(r=>{if(!Array.isArray(r)){document.getElementById('res').textContent='Agrega ?token=… a la URL';return}
const y=r.filter(x=>x.subioDeseos).length;document.getElementById('res').textContent='Quién ya pidió su regalo';document.getElementById('res2').textContent=y+' de '+r.length+' ya subieron deseos';const pc=Math.round(100*y/r.length);document.getElementById('pct').textContent=pc+'%';document.getElementById('ring').style.background='conic-gradient(var(--salvia-o) '+pc+'%,var(--linea) 0)';
document.getElementById('t').innerHTML=r.map(x=>'<div class="row"><span class="av" style="background:'+avatarColor(x.nombre)+'">'+initials(x.nombre)+'</span><span class="nm">'+x.nombre+'</span><span class="ct">'+x.deseos+' 🎁</span><span class="pill '+(x.subioDeseos?'ok">Listo':x.soloPrecargados?'pi">Solo pista':'no">Pendiente')+'</span></div>').join('')})</script></body></html>

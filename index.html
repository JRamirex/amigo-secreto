<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amigo Secreto en familia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="style.css"></head><body><div class="wrap">
<header><div data-orn></div><p class="eyebrow">Navidad en familia · 2026</p><h1>Amigo <em>Secreto</em></h1><p>Pide lo que sueñas, regala con cariño</p></header>
<div class="chips"><span class="chip">🎁 Hasta <b id="pres"></b></span><span class="chip">🕯️ Cierra jue 26 nov · 11:59 p.m.</span></div>
<div class="card"><h2 class="center">Faltan para cerrar la lista</h2><div class="cd" id="cd"></div></div>

<footer>Hecho con cariño para la familia 🌲 · <a href="ruleta.html" style="color:inherit">Sorteo</a></footer></div>

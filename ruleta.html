<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorteo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="style.css">
</head><body><div class="wrap">
<header><div data-orn></div><p class="eyebrow">Fase 2</p><h1>El <em>sorteo</em></h1><p id=st>Muy pronto…</p></header>
<div class="card" style="text-align:center"><div class="wheel"><div class="pin"></div><div class="hub">🎁</div><canvas id="c" width="600" height="600"></canvas></div><button class="btn full" id="go" disabled>Girar la ruleta</button><div id="lista" hidden></div><p class="hint">El sorteo se abre después del cierre de deseos. Nadie se saca a sí mismo ni a alguien de su grupo familiar.</p></div></div>
<script src="deco.js"></script><script src="store.js"></script>
<script>
// FASE 2 estática: config embebida (de config.json). Activar con fase2.activa=true. Sorteo determinista por semilla:
// nadie se saca a sí mismo ni a alguien de su grupo familiar.
const C={"participantes": ["Hilda", "Elio", "Jenny", "Claudia", "Leonor", "Nancy", "William", "Juanda", "Diana", "Santi", "Moni", "Willi", "Naty", "Juan Pa", "Leonardo", "Pilar", "Liliana", "Juancho", "Juanse", "María", "July", "Andrew"], "fase2": {"activa": false, "semilla": "navidad-2026", "grupos": [["Hilda", "Elio", "Jenny", "Claudia", "Leonor"], ["Nancy", "William", "Juanda", "Diana", "Santi", "July", "Andrew"], ["Moni", "Willi", "Naty", "Juan Pa"], ["Leonardo", "Pilar"], ["Liliana", "Juancho", "Juanse", "María"]]}};
function rng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}
function sorteo(P,G,seed){const g={};G.forEach((l,i)=>l.forEach(p=>g[p]=i));const R=rng(seed);
 for(let t=0;t<5000;t++){const r=P.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[r[i],r[j]]=[r[j],r[i]]}
  if(P.every((p,i)=>r[i]!==p&&(g[p]===undefined||g[p]!==g[r[i]])))return Object.fromEntries(P.map((p,i)=>[p,r[i]]))}return null}
const n=C.participantes,cv=document.getElementById('c'),x=cv.getContext('2d'),a=2*Math.PI/n.length,col=['#8fa98a','#c8694a','#f1e6d0','#5d7a5a'];
n.forEach((p,i)=>{x.beginPath();x.moveTo(300,300);x.arc(300,300,290,i*a,(i+1)*a);x.fillStyle=col[i%4];x.fill();x.save();x.translate(300,300);x.rotate(i*a+a/2);x.fillStyle=i%4==2?'#3a3a34':'#fff';x.font='600 21px Inter, system-ui';x.textAlign='right';x.fillText(p,270,8);x.restore()});
x.beginPath();x.arc(300,300,40,0,7);x.fillStyle='#fffaf1';x.fill();
if(C.fase2.activa){const M=sorteo(n,C.fase2.grupos,C.fase2.semilla),st=document.getElementById('st'),g=document.getElementById('go');
 const sel=document.createElement('select');sel.className='btn sec full';sel.innerHTML='<option value="">¿Quién eres?</option>'+n.map(p=>'<option>'+p+'</option>').join('');g.before(sel);
 st.textContent='¡Llegó el momento!';sel.onchange=()=>g.disabled=!sel.value;let rot=0;
 g.onclick=()=>{const t=M[sel.value],i=n.indexOf(t);rot+=360*6+((270-(i*360/n.length+180/n.length)-rot)%360+360)%360;cv.style.transition='transform 4s cubic-bezier(.2,.8,.2,1)';cv.style.transform='rotate('+rot+'deg)';g.disabled=true;
  setTimeout(()=>{st.textContent=sel.value+', te tocó: '+t+' 🎁';verDeseos(t)},4100)}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function verDeseos(t){const L=document.getElementById('lista');L.hidden=false;let w=[];
 try{w=(await kvGet(t)).map(x=>({deseo:x.descripcion,url:(x.urls||[]).join(' ')}))}catch(e){}
 L.innerHTML='<h2>Deseos de '+esc(t)+'</h2><div class="limit">Límite: <b>$200.000 COP</b></div>'+(w.length?w.map((r,i)=>'<div class="wish" style="text-align:left"><div class="on">Opción '+(i+1)+'</div><div class="t">'+esc(r.deseo||'')+'</div><div class="links">'+String(r.url||'').split(/\s+/).filter(Boolean).map(u=>'<a class="lk" href="'+esc(u)+'" target="_blank" rel="noopener"><span>'+esc(u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0])+'</span></a>').join('')+'</div></div>').join(''):'<p class="empty">'+esc(t)+' aún no tiene deseos en la lista.</p>')}
if(location.hash.startsWith('#ver='))verDeseos(decodeURIComponent(location.hash.slice(5)));
</script></body></html>
